; Point-in-time test of the daily closing-high breakout (research). Read by crypto_pit.py.
; These values are PRE-REGISTERED (reports/BREAKOUT_PREREGISTRATION.md). crypto_pit.py checks them
; against its frozen copy and refuses to run on a mismatch. Paths and network keys are free to change.

[rule]
setup = breakout_close_high
lookback = 20
window_bars = 250
horizon_days = 5
per_symbol_overlap = false

[eligibility]
min_quote_volume = 2000000
min_trades = 2000
max_missing_bars = 2
max_zero_volume_ratio = 0.05

[costs]
spot_per_side = 0.0015
usdm_per_side = 0.0010
usdm_funding = true

[periods]
holdout_spot_start = 2018-01-01
holdout_usdm_start = 2020-01-01
holdout_end = 2022-09-23
development_start = 2022-09-24
development_end = 2026-10-25
data_end = 2026-10-31T00:00Z

[statistics]
block_days = 20
replicates = 5000
seed = 7
newey_west_lag = 5
max_asset_share = 0.25
top_trim = 0.01

[data]
; downloaded candles and funding (large; not committed)
dir = trader/cache/binance/pit
max_workers = 4
weight_safety = 0.6
