; trader-scanner crypto scan: Binance Spot and USD-M Futures, public market data only.
; Copy to trader/binance.ini (the default path) or pass --config FILE.
; Every key has a built-in default (crypto_scan.py DEFAULTS); this file lists them all.
; A key may carry a per-timeframe override: `bars@1h = 500` wins over `bars` on 1h.
; Comments start with ; or #.

[provider]
name = binance
; spot | usdm   (usdm = USD-M Futures; --market overrides)
market = spot

[universe]
; allowlist  : the `symbols` below (base assets like SUI, or full symbols like SUIUSDT)
; top_volume : the top_n most traded markets by 24h quote volume, after the filters
; all        : every listed market in the quote asset (slow on spot: ~500 markets)
mode = allowlist
; verified 2026-10-31: DEEP has no Spot USDT market (Futures only). Unlisted names are reported, never guessed.
symbols = BTC, ETH, SUI, INJ, XRP, SOL, BNB, PAXG, PENGU, WAL, DEEP, ONDO, ZEC, HYPE, DOGE, TAO
top_n = 40
; stablecoin and fiat bases are never opportunities
exclude_bases = USDC, FDUSD, TUSD, USDP, DAI, BUSD, USDE, USD1, USDS, RLUSD, XUSD, BFUSD, EUR, EURI, AEUR, USDEB, RWUSD, PYUSD, U
; futures only: perpetuals on crypto underlyings. TRADIFI_PERPETUAL (equity perps), quarterlies and
; PREMARKET contracts are left out unless you list them here.
contract_types = PERPETUAL
underlying_types = COIN

[groups]
; --symbols @name scans a group. Binance publishes no ecosystem tag: these lists are yours to keep.
; (verified listed 2026-10-31: SUI, WAL, CETUS, HAEDAL on both markets; DEEP on Futures only)
sui_ecosystem = SUI, DEEP, WAL, CETUS, HAEDAL

[quote]
asset = USDT

[timeframes]
; 1d and 1h are the supported pair; 4h works the same way. 15m and lower run, but no rule here
; was designed or checked on them.
intervals = 1d, 1h
; closed candles fetched per timeframe (more than the rules need, so indicators are warmed up)
bars = 250
bars@1h = 500

[liquidity]
min_quote_volume_24h = 2000000
min_trades_24h = 2000
; spread from the 24h ticker (spot) or the book ticker (futures), in basis points of the mid
max_spread_bps = 30
; in the window the rules read
max_zero_volume_ratio = 0.05
max_missing_bars = 2
; the 24h ticker's closeTime against the scan clock
max_price_age_seconds = 600

[setups]
enabled = breakout_close_high, bull_flag, reclaim_ma, rsi_oversold, oversold_bounce, rvol_expansion, momentum_accel

; Defaults are the equity daily scan's numbers, counted in bars of each timeframe.
[setup.breakout_close_high]
lookback = 20

[setup.bull_flag]
impulse_bars = 10
impulse_pct = 10
flag_bars = 5
flag_range_pct = 5
; uncomment to scale the flag to hourly bars (an explicit, recorded redefinition):
; impulse_pct@1h = 4
; flag_range_pct@1h = 2

[setup.reclaim_ma]
period = 20

[setup.rsi_oversold]
period = 14
threshold = 30

[setup.oversold_bounce]
period = 14
threshold = 30

[setup.rvol_expansion]
lookback = 20
min_rvol = 2.0

[setup.momentum_accel]
bars = 5
min_delta_pct = 2.0

[setup.utc_orb]
; EXPERIMENTAL and off: crypto has no opening bell. A range anchored at a UTC clock time,
; then the first close above its high. Untested for edge.
; Measured 2026-08-02..2026-10-31 (15 spot markets, 1h): no activity spike at 00:00 UTC; the
; busiest hours are 13:00-15:59 UTC (14:00 holds 7.0% of daily volume against 4.2% uniform),
; around the US equity cash open. 13:30 is the anchor with a market-structure reason behind it;
; 00:00 is kept as the default only because it is the daily candle boundary.
enabled = false
interval = 15m
anchor = 00:00
range_minutes = 60
expire_minutes = 480

[network]
max_workers = 4
; share of Binance's published weight limit to spend (spot 6000/min, futures 2400/min)
weight_safety = 0.6
retries = 4
backoff_seconds = 1.0
timeout_seconds = 20
; futures: open-interest requests for the first N candidates (funding and basis come in one request)
max_context_requests = 40

[output]
path = trader/crypto_watchlist.json
show = 20
; a folder to record this run's answers into (the --offline fixture layout); empty = off
record_dir =

[cache]
dir = trader/cache/binance
exchange_info_ttl_seconds = 3600

